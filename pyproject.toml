[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-nlt-signal"
version = "0.1.0"
description = "Net-Load Tightness signal on the DE-LU bidding zone from free ENTSO-E data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
fetch = ["entsoe-py>=0.6"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
